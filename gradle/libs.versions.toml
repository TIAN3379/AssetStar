[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.7"
composeBom = "2026.05.00"
activityCompose = "1.12.0"
coreKtx = "1.18.0"
lifecycle = "2.9.4"
navigationCompose = "2.9.5"
room = "2.8.4"
coil = "2.7.0"
lottieCompose = "6.6.7"
junit = "4.13.2"
